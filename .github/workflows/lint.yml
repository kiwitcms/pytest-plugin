name: lint

on:
  push:
    branches: master
  pull_request:

jobs:
  black:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: [3.14]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - uses: psf/black@258e7dbf348bc23cb70b8cdf693481c04634ebcc # 26.10.1
